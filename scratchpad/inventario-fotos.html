<style>
  :root { --navy:#0d1b2a; --gold:#b8892f; --ivory:#faf7f0; --border:#ece5d4; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'Inter',Segoe UI,system-ui,sans-serif; background:var(--ivory); color:#1c2733; padding:28px; }
  header.top { background:var(--navy); color:#fff; padding:20px 24px; border-radius:10px; margin-bottom:24px; }
  header.top h1 { font-family:Georgia,serif; font-size:1.5rem; margin-bottom:6px; }
  header.top p { color:rgba(255,255,255,.75); font-size:.9rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:20px; }
  .card { background:#fff; border:1px solid var(--border); border-radius:10px; overflow:hidden; }
  .card h2 { font-family:Georgia,serif; font-size:1rem; padding:10px 14px;
             background:var(--navy); color:#fff; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  .card img { width:100%; height:300px; object-fit:contain; background:#20303f; display:block; }
  .missing { height:300px; display:flex; align-items:center; justify-content:center;
             background:#fdf0f0; color:#7d2020; font-weight:600; }
  figcaption { padding:12px 14px; font-size:.82rem; }
  .use { border-left:3px solid var(--gold); padding:6px 10px; margin-bottom:8px; background:#faf3e3; }
  .use.none { border-left-color:#c53030; background:#fdf0f0; color:#7d2020; }
  .sec { font-weight:700; display:block; }
  .ln { color:#6b6355; font-size:.75rem; }
  .alt { margin-top:4px; color:#4a4437; font-style:italic; }
  .badge { font-size:.68rem; text-transform:uppercase; letter-spacing:.08em;
           padding:3px 8px; border-radius:20px; font-family:'Inter',sans-serif; }
  .badge.unused { background:#fff8e6; color:#8a6414; }
  .badge.dup { background:#e8f5e9; color:#2f855a; }
  .card.unused h2 { background:#8a6414; }
  .card.dup h2 { background:#2f855a; }
</style>
</head>
